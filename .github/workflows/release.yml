name: Release

# Push a tag like v1.2 to build a signed APK and attach it to a GitHub Release.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of release-keystore.jks   (base64 -i release-keystore.jks | pbcopy)
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# Use the keystore that signed the copy already installed on your phone, or Android will refuse
# the update.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for src in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$src" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            apk="babeltrout-${GITHUB_REF_NAME}-${abi}.apk"
            cp "$src" "$apk"
            files+=("$apk")
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt

          # Release notes: download hint, then this version's CHANGELOG.md section. GitHub appends its
          # generated list of merged PRs after these notes.
          version="${GITHUB_REF_NAME#v}"
          if ! section="$(scripts/changelog_section.sh "$version")"; then
            echo "::warning::CHANGELOG.md has no section for $version; release notes list PRs only."
            section=""
          fi
          {
            echo "Most phones: download the **arm64-v8a** APK. Older 32-bit phones: armeabi-v7a."
            if [ -n "$section" ]; then
              echo
              echo "## What's new in $version"
              echo
              echo "$section"
            fi
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS.txt --generate-notes --notes-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
