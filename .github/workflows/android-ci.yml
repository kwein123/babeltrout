name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # the ~60 MB Farsi voice is not needed to build; skip it to save LFS bandwidth

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # v5 is the newest MIT-licensed major; v6 moves caching into a proprietary component with its own
      # terms of use (https://blog.gradle.org/github-actions-for-gradle-v6). Dependabot ignores v6+.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Lint (errors fail the build)
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore # a failure before tests ran leaves no reports

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: babeltrout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
