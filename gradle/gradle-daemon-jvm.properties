# Gradle runs on any Java 21 that's already installed: Android Studio's bundled JetBrains Runtime on a
# developer machine, Temurin 21 from actions/setup-java in CI. No vendor and no download URLs, so a
# build never depends on a third-party JDK download service. (The pinned foojay links that
# updateDaemonJvm generated stopped working in October 2026 and broke CI.)
toolchainVersion=21
